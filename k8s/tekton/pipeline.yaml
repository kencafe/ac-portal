apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ns-web-cicd
  namespace: ac-portal-dev
spec:
  description: >
    DevSecOps CI/CD for AC-Portal (OWASP-aligned): pre-commit (gitleaks) →
    vulnerability scanning (Dependency-Check SCA, Semgrep SAST, Trivy image) →
    build → DefectDojo import → deploy → DAST (staging) → compliance audit.
  params:
    - { name: git-url, type: string }
    - { name: git-revision, type: string, default: dev }
    - { name: env, type: string }
    - { name: target-namespace, type: string }
    - { name: deploy-host, type: string }
    - { name: run-dast, type: string, default: "false" }
  workspaces:
    - name: shared
  tasks:
    - name: fetch
      taskRef: { kind: ClusterTask, name: git-clone }
      params:
        - { name: url, value: $(params.git-url) }
        - { name: revision, value: $(params.git-revision) }
        - { name: deleteExisting, value: "true" }
      workspaces:
        - { name: output, workspace: shared }

    # ---- pre-commit: secret scan ----
    - name: secret-scan
      runAfter: [fetch]
      taskRef: { kind: Task, name: gitleaks-scan }
      workspaces: [{ name: source, workspace: shared }]

    # ---- vulnerability scanning: SCA (Dependency-Check) + SAST (Semgrep) ----
    # SCA (Dependency-Check) runs in parallel and is advisory — it does not gate
    # build/deploy (NVD update can be slow), but its report still feeds DefectDojo.
    - name: sca
      runAfter: [fetch]
      timeout: "20m"
      taskRef: { kind: Task, name: dependency-check-scan }
      workspaces: [{ name: source, workspace: shared }]
    - name: sast
      runAfter: [fetch]
      timeout: "15m"
      taskRef: { kind: Task, name: semgrep-sast }
      workspaces: [{ name: source, workspace: shared }]

    # ---- compliance audit (parallel) ----
    - name: compliance
      runAfter: [fetch]
      taskRef: { kind: Task, name: kube-linter-scan }
      workspaces: [{ name: source, workspace: shared }]

    # ---- build image (gated on the code scans) ----
    # Build gates only on the fast secret scan; SCA/SAST run in parallel and are
    # advisory (their large scanner images can take minutes to pull first time).
    - name: build
      runAfter: [secret-scan]
      taskRef: { kind: Task, name: oc-run }
      params:
        - name: SCRIPT
          value: |
            set -e
            oc apply -k k8s/overlays/$(params.env)
            echo "Starting binary build in $(params.target-namespace)…"
            oc -n $(params.target-namespace) start-build ac-portal --from-dir=. --follow --wait
      workspaces: [{ name: manifest-dir, workspace: shared }]

    # ---- container image scan (Trivy — image only) ----
    - name: image-scan
      runAfter: [build]
      taskRef: { kind: Task, name: trivy-image-scan }
      params:
        - { name: IMAGE, value: "image-registry.openshift-image-registry.svc:5000/$(params.target-namespace)/ac-portal:latest" }
      workspaces: [{ name: source, workspace: shared }]

    # ---- aggregate findings into DefectDojo ----
    - name: defectdojo
      runAfter: [image-scan, sca, sast, secret-scan]
      taskRef: { kind: Task, name: defectdojo-upload }
      params:
        - { name: ENGAGEMENT, value: "ci-$(params.env)" }
      workspaces: [{ name: source, workspace: shared }]

    # ---- deploy / roll out the freshly built image ----
    - name: deploy
      runAfter: [image-scan]
      taskRef: { kind: Task, name: oc-run }
      params:
        - name: SCRIPT
          value: |
            set -e
            oc -n $(params.target-namespace) rollout restart deploy/ac-portal
            oc -n $(params.target-namespace) rollout status deploy/ac-portal --timeout=240s
      workspaces: [{ name: manifest-dir, workspace: shared }]

    # ---- DAST against the running staging site → DefectDojo ----
    - name: dast
      runAfter: [deploy]
      when:
        - input: $(params.run-dast)
          operator: in
          values: ["true"]
      taskRef: { kind: Task, name: zap-dast }
      params:
        - { name: TARGET_URL, value: "https://$(params.deploy-host)" }
        - { name: ENGAGEMENT, value: "dast-$(params.env)" }
      workspaces: [{ name: source, workspace: shared }]
