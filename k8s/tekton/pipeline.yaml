apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ns-web-cicd
  namespace: ac-portal-dev
spec:
  description: >
    DevSecOps CI/CD for the FPT-IS Next Gen Service site. OWASP-aligned:
    pre-commit (gitleaks) → vulnerability scanning (SCA/SAST/image) → build →
    deploy → DAST (staging) → compliance audit.
  params:
    - name: git-url
      type: string
    - name: git-revision
      type: string
      default: dev
    - name: env
      type: string
      description: dev | staging | prod
    - name: target-namespace
      type: string
    - name: deploy-host
      type: string
    - name: run-dast
      type: string
      default: "false"
  workspaces:
    - name: shared
  tasks:
    - name: fetch
      taskRef: { kind: ClusterTask, name: git-clone }
      params:
        - { name: url, value: $(params.git-url) }
        - { name: revision, value: $(params.git-revision) }
        - { name: deleteExisting, value: "true" }
      workspaces:
        - { name: output, workspace: shared }

    # ---- pre-commit: secret scan ----
    - name: secret-scan
      runAfter: [fetch]
      taskRef: { kind: Task, name: gitleaks-scan }
      workspaces: [{ name: source, workspace: shared }]

    # ---- vulnerability scanning: SCA + SAST ----
    - name: sca
      runAfter: [fetch]
      taskRef: { kind: Task, name: trivy-fs-scan }
      workspaces: [{ name: source, workspace: shared }]
    - name: sast
      runAfter: [fetch]
      taskRef: { kind: Task, name: semgrep-sast }
      workspaces: [{ name: source, workspace: shared }]

    # ---- compliance audit of manifests (parallel) ----
    - name: compliance
      runAfter: [fetch]
      taskRef: { kind: Task, name: kube-linter-scan }
      workspaces: [{ name: source, workspace: shared }]

    # ---- build image via OpenShift BuildConfig (gated on code scans) ----
    - name: build
      runAfter: [secret-scan, sca, sast]
      taskRef: { kind: ClusterTask, name: openshift-client }
      params:
        - name: SCRIPT
          value: |
            set -e
            oc apply -k k8s/overlays/$(params.env)
            echo "Starting binary build in $(params.target-namespace)…"
            oc -n $(params.target-namespace) start-build ac-portal --from-dir=. --follow --wait
      workspaces: [{ name: manifest-dir, workspace: shared }]

    # ---- container image scan ----
    - name: image-scan
      runAfter: [build]
      taskRef: { kind: Task, name: trivy-image-scan }
      params:
        - { name: IMAGE, value: "image-registry.openshift-image-registry.svc:5000/$(params.target-namespace)/ac-portal:latest" }

    # ---- deploy / roll out the freshly built image ----
    - name: deploy
      runAfter: [image-scan]
      taskRef: { kind: ClusterTask, name: openshift-client }
      params:
        - name: SCRIPT
          value: |
            set -e
            oc -n $(params.target-namespace) rollout restart deploy/ac-portal
            oc -n $(params.target-namespace) rollout status deploy/ac-portal --timeout=240s
      workspaces: [{ name: manifest-dir, workspace: shared }]

    # ---- DAST against the running staging site ----
    - name: dast
      runAfter: [deploy]
      when:
        - input: $(params.run-dast)
          operator: in
          values: ["true"]
      taskRef: { kind: Task, name: zap-dast }
      params: [{ name: TARGET_URL, value: "https://$(params.deploy-host)" }]
