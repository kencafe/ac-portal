# DevSecOps security tasks (OWASP DevSecOps Guideline aligned).
# Images are mirrored into the internal registry (see BOOTSTRAP.md) because the
# nodes cannot pull Docker Hub / ghcr directly.
# `onError: continue` keeps scans advisory so a finding/limit never blocks the
# release; tighten to blocking once the baseline + offline DBs are in place.
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: gitleaks-scan
  namespace: ac-portal-dev
spec:
  description: Secret/leak scan (pre-commit stage).
  workspaces:
    - name: source
  steps:
    - name: gitleaks
      onError: continue
      image: image-registry.openshift-image-registry.svc:5000/ac-portal-dev/gitleaks:v8.18.4
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        echo "== Gitleaks secret scan =="
        gitleaks detect --source=. --redact -v --exit-code=0 || true
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-fs-scan
  namespace: ac-portal-dev
spec:
  description: SCA + secret filesystem scan.
  workspaces:
    - name: source
  steps:
    - name: trivy-fs
      onError: continue
      image: image-registry.openshift-image-registry.svc:5000/ac-portal-dev/trivy:0.53.0
      workingDir: $(workspaces.source.path)
      computeResources:
        requests: { memory: 512Mi, cpu: 250m }
        limits: { memory: 2Gi, cpu: "1" }
      script: |
        #!/bin/sh
        echo "== Trivy filesystem scan (SCA + secrets) =="
        trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --no-progress --exit-code 0 . || true
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: semgrep-sast
  namespace: ac-portal-dev
spec:
  description: Static application security testing.
  workspaces:
    - name: source
  steps:
    - name: semgrep
      onError: continue
      image: image-registry.openshift-image-registry.svc:5000/ac-portal-dev/semgrep:latest
      workingDir: $(workspaces.source.path)
      computeResources:
        requests: { memory: 512Mi, cpu: 250m }
        limits: { memory: 2Gi, cpu: "1" }
      script: |
        #!/bin/sh
        echo "== Semgrep SAST =="
        semgrep scan --config auto --metrics off --error=false . || echo "semgrep skipped (offline rules)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-image-scan
  namespace: ac-portal-dev
spec:
  description: Container image vulnerability scan.
  params:
    - name: IMAGE
      type: string
  steps:
    - name: trivy-image
      onError: continue
      image: image-registry.openshift-image-registry.svc:5000/ac-portal-dev/trivy:0.53.0
      computeResources:
        requests: { memory: 512Mi, cpu: 250m }
        limits: { memory: 2Gi, cpu: "1" }
      script: |
        #!/bin/sh
        echo "== Trivy image scan: $(params.IMAGE) =="
        TOKEN_FILE=/var/run/secrets/kubernetes.io/serviceaccount/token
        if [ -f "$TOKEN_FILE" ]; then
          export TRIVY_USERNAME="serviceaccount"
          export TRIVY_PASSWORD="$(cat $TOKEN_FILE)"
        fi
        trivy image --severity HIGH,CRITICAL --no-progress --exit-code 0 --insecure $(params.IMAGE) || \
          echo "image scan skipped — SCA covered by trivy-fs"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kube-linter-scan
  namespace: ac-portal-dev
spec:
  description: Kubernetes manifest compliance auditing.
  workspaces:
    - name: source
  steps:
    - name: kube-linter
      onError: continue
      image: image-registry.openshift-image-registry.svc:5000/ac-portal-dev/kube-linter:latest
      workingDir: $(workspaces.source.path)
      command: ["/kube-linter"]
      args: ["lint", "k8s/"]
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: zap-dast
  namespace: ac-portal-dev
spec:
  description: OWASP ZAP baseline DAST against a running environment.
  params:
    - name: TARGET_URL
      type: string
  steps:
    - name: zap-baseline
      onError: continue
      image: image-registry.openshift-image-registry.svc:5000/ac-portal-dev/zaproxy:stable
      computeResources:
        requests: { memory: 512Mi, cpu: 250m }
        limits: { memory: 2Gi, cpu: "1" }
      script: |
        #!/bin/bash
        echo "== OWASP ZAP baseline DAST: $(params.TARGET_URL) =="
        mkdir -p /zap/wrk && cd /zap/wrk
        zap-baseline.py -t $(params.TARGET_URL) -I -m 2 || true
        echo "ZAP baseline finished."
---
# oc runner with enough memory for `oc apply -k` (kustomize) + start-build,
# which OOM under the 512Mi namespace default when using the stock clustertask.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: oc-run
  namespace: ac-portal-dev
spec:
  params:
    - name: SCRIPT
      type: string
  workspaces:
    - name: manifest-dir
  steps:
    - name: oc
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      workingDir: $(workspaces.manifest-dir.path)
      computeResources:
        requests: { memory: 512Mi, cpu: 250m }
        limits: { memory: 1536Mi, cpu: "1" }
      script: |
        #!/usr/bin/env bash
        set -eo pipefail
        $(params.SCRIPT)
