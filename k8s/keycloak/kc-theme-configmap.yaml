# GENERATED — do not hand-edit. Holds the fptis-ns Keycloak login theme.
# Keys are the theme paths under themes/fptis-ns/ with '/' flattened to '__';
# the keycloak Deployment's initContainer restores the tree into an emptyDir.
# Regenerate after editing theme/fptis-ns/:
#   SRC=k8s/keycloak/theme/fptis-ns; TMP=$(mktemp -d)
#   (cd "$SRC"; find . -type f | sed 's#^\./##' | while read f; do \
#      cp "$f" "$TMP/$(echo "$f" | sed 's#/#__#g')"; done)
#   oc -n ac-portal-dev create configmap kc-theme --from-file="$TMP" \
#      --dry-run=client -o yaml > k8s/keycloak/kc-theme-configmap.yaml
#   (then re-add the metadata labels + this header)
apiVersion: v1
binaryData:
  login__resources__img__ns-logo.png: 
data:
  login__error.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false pad="centered" showLogo=false stripe="error"; section>
      <#if section = "header">
        <@layout.statusIcon variant="error">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path></svg>
        </@layout.statusIcon>
        <h1 class="ns-title ns-title--sm">${msg("nsErrorTitle")}</h1>
        <p class="ns-subtitle ns-subtitle--relaxed"><#if message?? && message.summary?has_content>${kcSanitize(message.summary)?no_esc}<#else>${msg("nsErrorSubtitle")}</#if></p>

      <#elseif section = "form">
        <div class="ns-stack">
          <#if skipLink??>
          <#elseif client?? && client.baseUrl?has_content>
            <a href="${client.baseUrl}" class="ns-btn ns-btn--primary">${kcSanitize(msg("backToApplication"))?no_esc}</a>
          </#if>
          <a href="mailto:it-helpdesk@fpt.com" class="ns-btn ns-btn--ghost">${msg("nsReportToHelpdesk")}</a>
        </div>
        <span class="ns-ref">ref: KC-ERROR</span>
      </#if>
    </@layout.registrationLayout>
  login__login-page-expired.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false pad="centered" showLogo=false stripe="error"; section>
      <#if section = "header">
        <@layout.statusIcon variant="error">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5"></path><path d="M12 16.5h.01"></path></svg>
        </@layout.statusIcon>
        <h1 class="ns-title ns-title--sm">${msg("nsExpiredTitle")}</h1>
        <p class="ns-subtitle ns-subtitle--relaxed">${msg("nsExpiredSubtitle")}</p>

      <#elseif section = "form">
        <div class="ns-stack">
          <a id="loginRestartLink" href="${url.loginRestartFlowUrl}" class="ns-btn ns-btn--primary">${msg("nsLoginAgain")}</a>
          <a id="loginContinueLink" href="${url.loginAction}" class="ns-btn ns-btn--ghost">${msg("nsReportToHelpdesk")}</a>
        </div>
        <span class="ns-ref">ref: KC-EXPIRED-408</span>
      </#if>
    </@layout.registrationLayout>
  login__login-reset-password.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!messagesPerField.existsError('username') displayInfo=true showLogo=false; section>
      <#if section = "header">
        <a href="${url.loginUrl}" class="ns-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path></svg>
          ${msg("backToLogin")}
        </a>
        <h1 class="ns-title ns-title--tight">${msg("nsResetTitle")}</h1>
        <p class="ns-subtitle ns-subtitle--relaxed">${msg("nsResetSubtitle")}</p>

      <#elseif section = "form">
        <form id="kc-reset-password-form" class="ns-form" action="${url.loginAction}" method="post">
          <div class="ns-field">
            <label for="username" class="ns-label"><#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if></label>
            <input type="text" id="username" class="ns-input <#if messagesPerField.existsError('username')>ns-input--error</#if>" name="username" value="${(auth.attemptedUsername!'')}" autofocus placeholder="annv@fpt.com" dir="ltr" aria-invalid="<#if messagesPerField.existsError('username')>true</#if>">
            <#if messagesPerField.existsError('username')><span class="ns-field-error" aria-live="polite">${kcSanitize(messagesPerField.get('username'))?no_esc}</span></#if>
          </div>
          <button class="ns-btn ns-btn--primary" type="submit">${msg("nsResetSubmit")}</button>
        </form>

      <#elseif section = "info">
        <p class="ns-help-line">${msg("nsResetHelpPrefix")} <a href="mailto:it-helpdesk@fpt.com" class="ns-link">${msg("nsHelpdesk")}</a>.</p>
      </#if>
    </@layout.registrationLayout>
  login__login-update-password.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false showLogo=false; section>
      <#if section = "header">
        <h1 class="ns-title ns-title--tight">${msg("nsUpdatePwTitle")}</h1>

      <#elseif section = "form">
        <div class="ns-alert ns-alert--warning" role="alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
          <span class="ns-alert-text"><#if message?? && message.summary?has_content>${kcSanitize(message.summary)?no_esc}<#else>${msg("nsPwExpiredNotice")}</#if></span>
        </div>

        <form id="kc-passwd-update-form" class="ns-form" action="${url.loginAction}" method="post">
          <div class="ns-field">
            <label for="password-new" class="ns-label">${msg("passwordNew")}</label>
            <div class="ns-pw-wrap">
              <input type="password" id="password-new" class="ns-input ns-input--pw <#if messagesPerField.existsError('password','password-confirm')>ns-input--error</#if>" name="password-new" autofocus autocomplete="new-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
                data-pw-strength data-meter="ns-pw-meter" data-meter-label="ns-pw-label">
              <button class="ns-pw-toggle" type="button" aria-label="${msg('nsShowPassword')}" data-pw-toggle data-target="password-new"
                data-label-show="${msg('nsShowPassword')}" data-label-hide="${msg('nsHidePassword')}">
                <svg class="ns-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg class="ns-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M10.7 5.1A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a13.2 13.2 0 0 1-2.2 2.9M6.6 6.6C3.9 8.2 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.4-1"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path><path d="m2 2 20 20"></path></svg>
              </button>
            </div>
            <div class="ns-pw-meter" id="ns-pw-meter"><span></span><span></span><span></span></div>
            <span class="ns-pw-label" id="ns-pw-label">${msg("nsPwHint")}</span>
            <#if messagesPerField.existsError('password')><span class="ns-field-error" aria-live="polite">${kcSanitize(messagesPerField.get('password'))?no_esc}</span></#if>
          </div>

          <div class="ns-field">
            <label for="password-confirm" class="ns-label">${msg("passwordConfirm")}</label>
            <div class="ns-pw-wrap">
              <input type="password" id="password-confirm" class="ns-input ns-input--pw <#if messagesPerField.existsError('password-confirm')>ns-input--error</#if>" name="password-confirm" autocomplete="new-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;">
              <button class="ns-pw-toggle" type="button" aria-label="${msg('nsShowPassword')}" data-pw-toggle data-target="password-confirm"
                data-label-show="${msg('nsShowPassword')}" data-label-hide="${msg('nsHidePassword')}">
                <svg class="ns-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                <svg class="ns-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M10.7 5.1A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a13.2 13.2 0 0 1-2.2 2.9M6.6 6.6C3.9 8.2 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.4-1"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path><path d="m2 2 20 20"></path></svg>
              </button>
            </div>
            <#if messagesPerField.existsError('password-confirm')><span class="ns-field-error" aria-live="polite">${kcSanitize(messagesPerField.get('password-confirm'))?no_esc}</span></#if>
          </div>

          <#if isAppInitiatedAction??>
            <label class="ns-check"><input type="checkbox" id="logout-sessions" name="logout-sessions" value="on" checked>${msg("logoutOtherSessions")}</label>
            <div class="ns-grid-2">
              <button class="ns-btn ns-btn--primary" type="submit">${msg("nsUpdatePwSubmit")}</button>
              <button class="ns-btn ns-btn--secondary" type="submit" name="cancel-aia" value="true">${msg("doCancel")}</button>
            </div>
          <#else>
            <label class="ns-check"><input type="checkbox" id="logout-sessions" name="logout-sessions" value="on" checked>${msg("logoutOtherSessions")}</label>
            <button class="ns-btn ns-btn--primary" type="submit">${msg("nsUpdatePwSubmit")}</button>
          </#if>
        </form>
      </#if>
    </@layout.registrationLayout>
  login__login-verify-email.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false pad="centered" showLogo=false; section>
      <#if section = "header">
        <@layout.statusIcon variant="info">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2.5"></rect><path d="m3 7 9 6 9-6"></path></svg>
        </@layout.statusIcon>
        <h1 class="ns-title ns-title--sm">${msg("nsVerifyTitle")}</h1>
        <p class="ns-subtitle ns-subtitle--relaxed">${msg("nsVerifyInstruction", (user.email!''))?no_esc}</p>

      <#elseif section = "form">
        <#if url.loginAction??>
          <form class="ns-form ns-form--center" action="${url.loginAction}" method="post">
            <button class="ns-btn ns-btn--secondary" type="submit">${msg("nsVerifyResend")}</button>
          </form>
        </#if>
        <a href="${url.loginRestartFlowUrl}" class="ns-link ns-link--muted">${msg("backToLogin")}</a>
      </#if>
    </@layout.registrationLayout>
  login__login.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=!messagesPerField.existsError('username','password') displayInfo=(realm.password && realm.registrationAllowed && !registrationDisabled??) showFooter=true; section>
      <#if section = "header">
        <h1 class="ns-title">${msg("nsLoginTitle")}</h1>
        <p class="ns-subtitle">${msg("nsLoginSubtitle")}</p>

      <#elseif section = "form">
        <#-- ===== IdP block (only when identity providers are configured) ===== -->
        <#if realm.password && social?? && social.providers?? && social.providers?has_content>
          <div class="ns-idp-group">
            <#list social.providers as p>
              <a id="social-${p.alias}" href="${p.loginUrl}" class="ns-idp ns-idp--${p.alias?lower_case}">
                <#if p.alias?lower_case?contains('microsoft') || p.alias?lower_case?contains('entra') || p.alias?lower_case?contains('azure')>
                  <svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="0" y="0" width="7" height="7" fill="#F25022"></rect><rect x="9" y="0" width="7" height="7" fill="#7FBA00"></rect><rect x="0" y="9" width="7" height="7" fill="#00A4EF"></rect><rect x="9" y="9" width="7" height="7" fill="#FFB900"></rect></svg>
                <#elseif p.alias?lower_case?contains('google')>
                  <span class="ns-g">G</span>
                <#elseif p.alias?lower_case?contains('ldap') || p.alias?lower_case?contains('ad')>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7.5" cy="15.5" r="4.5"></circle><path d="m21 2-9.6 9.6"></path><path d="m15.5 7.5 3 3L22 7l-3-3"></path></svg>
                <#else>
                  <span class="ns-idp-dot"></span>
                </#if>
                <span>${msg("nsContinueWith")} ${p.displayName!p.alias}</span>
              </a>
            </#list>
          </div>
          <#if realm.password>
            <div class="ns-divider"><span class="ns-divider-line"></span><span class="ns-divider-text">${msg("nsOrLocalAccount")}</span><span class="ns-divider-line"></span></div>
          </#if>
        </#if>

        <#-- ===== Local account form (always shown when realm.password) ===== -->
        <#if realm.password>
          <div class="ns-badge-row">
            <span class="ns-badge">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10.5" width="16" height="10" rx="2"></rect><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"></path></svg>
              ${msg("nsLocalAccount")}
            </span>
            <span class="ns-badge-note">${msg("nsLocalAccountNote")}</span>
          </div>

          <form id="kc-form-login" class="ns-form" onsubmit="login.disabled = true; return true;" action="${url.loginAction}" method="post">
            <div class="ns-field">
              <label for="username" class="ns-label"><#if !realm.loginWithEmailAllowed>${msg("username")}<#elseif !realm.registrationEmailAsUsername>${msg("usernameOrEmail")}<#else>${msg("email")}</#if></label>
              <input tabindex="1" id="username" class="ns-input <#if messagesPerField.existsError('username','password')>ns-input--error</#if>" name="username" value="${(login.username!'')}" type="text" autofocus autocomplete="username" placeholder="tennv@fpt.com" dir="ltr" aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>">
              <#if messagesPerField.existsError('username','password')>
                <span id="input-error" class="ns-field-error" aria-live="polite">${kcSanitize(messagesPerField.getFirstError('username','password'))?no_esc}</span>
              </#if>
            </div>

            <div class="ns-field">
              <label for="password" class="ns-label">${msg("password")}</label>
              <div class="ns-pw-wrap">
                <input tabindex="2" id="password" class="ns-input ns-input--pw <#if messagesPerField.existsError('username','password')>ns-input--error</#if>" name="password" type="password" autocomplete="current-password" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" aria-invalid="<#if messagesPerField.existsError('username','password')>true</#if>">
                <button class="ns-pw-toggle" type="button" aria-label="${msg('nsShowPassword')}" data-pw-toggle data-target="password"
                  data-label-show="${msg('nsShowPassword')}" data-label-hide="${msg('nsHidePassword')}">
                  <svg class="ns-eye" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                  <svg class="ns-eye-off" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M10.7 5.1A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a13.2 13.2 0 0 1-2.2 2.9M6.6 6.6C3.9 8.2 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 4.4-1"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path><path d="m2 2 20 20"></path></svg>
                </button>
              </div>
            </div>

            <div class="ns-row-between">
              <#if realm.rememberMe && !usernameHidden??>
                <label class="ns-check">
                  <input tabindex="3" id="rememberMe" name="rememberMe" type="checkbox" <#if login.rememberMe??>checked</#if>>${msg("rememberMe")}
                </label>
              <#else>
                <span></span>
              </#if>
              <#if realm.resetPasswordAllowed>
                <a tabindex="5" href="${url.loginResetCredentialsUrl}" class="ns-link">${msg("doForgotPassword")}</a>
              </#if>
            </div>

            <input type="hidden" id="id-hidden-input" name="credentialId" <#if auth.selectedCredential?has_content>value="${auth.selectedCredential}"</#if>>
            <button tabindex="4" class="ns-btn ns-btn--primary" name="login" id="kc-login" type="submit">${msg("doLogIn")}</button>
          </form>
        </#if>

      <#elseif section = "info">
        <#if realm.password && realm.registrationAllowed && !registrationDisabled??>
          <p class="ns-info-line">${msg("noAccount")} <a tabindex="6" href="${url.registrationUrl}" class="ns-link ns-link--strong">${msg("doRegister")}</a></p>
        </#if>
      </#if>
    </@layout.registrationLayout>
  login__logout-confirm.ftl: |
    <#import "template.ftl" as layout>
    <@layout.registrationLayout displayMessage=false pad="centered" showLogo=false; section>
      <#if section = "header">
        <@layout.statusIcon variant="success">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3"></path><path d="m15 16 5-4-5-4"></path><path d="M20 12H9"></path></svg>
        </@layout.statusIcon>
        <h1 class="ns-title ns-title--sm">${msg("nsLogoutTitle")}</h1>
        <p class="ns-subtitle ns-subtitle--relaxed">${msg("nsLogoutSubtitle")}</p>

      <#elseif section = "form">
        <div class="ns-stack">
          <form class="ns-form ns-form--center" action="${url.logoutConfirmAction}" method="post">
            <input type="hidden" name="session_code" value="${logoutConfirm.code}">
            <#if logoutConfirm.skipLink>
            <#else>
              <#if client?? && client.baseUrl?has_content>
                <input type="hidden" name="client_id" value="${client.clientId}">
              </#if>
            </#if>
            <button class="ns-btn ns-btn--primary" type="submit" name="confirmLogout" id="kc-logout" value="true">${msg("nsLogoutConfirm")}</button>
          </form>
          <#if logoutConfirm.skipLink>
          <#elseif client?? && client.baseUrl?has_content>
            <a href="${client.baseUrl}" class="ns-btn ns-btn--secondary">${msg("nsBackHome")}</a>
          </#if>
        </div>
      </#if>
    </@layout.registrationLayout>
