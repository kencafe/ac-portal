# Build-once artefacts live in the CI hub. The pipeline builds ac-portal:latest
# HERE (binary Docker build), then promotes it to each env by `oc tag`.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ac-portal
  namespace: ac-portal-cicd
  labels:
    app: ac-portal
    component: cicd
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ac-portal
  namespace: ac-portal-cicd
  labels:
    app: ac-portal
    component: cicd
spec:
  # Binary source streamed by the pipeline via `oc start-build --from-dir`.
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      # NOTE: npm via the org Nexus proxy was tested and REMOVED — on these
      # egress=fast build nodes, direct npm ci is ~2-3 min, whereas the shared
      # Nexus's own (cold) egress to npmjs timed out on large tarballs. Re-enable
      # by setting the NPM_REGISTRY build-arg only after pre-warming the Nexus
      # npm cache (see INFRA notes). Left off so builds stay fast + reliable.
  output:
    to:
      kind: ImageStreamTag
      name: ac-portal:latest
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "8Gi"
      cpu: "2"
