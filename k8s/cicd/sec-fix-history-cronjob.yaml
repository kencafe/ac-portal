# Weekly SEC fix-history digest (SEC-002 / W4). Queries DefectDojo, writes a
# summary to logs + ConfigMap `sec-fix-history`, then best-effort delivers to
# Telegram (secret `sec-report-telegram`: keys token, chat_id). Telegram is
# NON-FATAL: an invalid/missing token or a send error is logged and skipped —
# the report itself always succeeds.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sec-fix-history
  namespace: ac-portal-cicd
spec:
  schedule: "0 1 * * 1"            # Mondays 08:00 Asia/Ho_Chi_Minh (01:00 UTC)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: ns-web-pipeline
          restartPolicy: OnFailure
          containers:
            - name: report
              image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
              env:
                - { name: DD_URL,   valueFrom: { secretKeyRef: { name: ns-web-defectdojo, key: DD_URL } } }
                - { name: DD_HOST,  valueFrom: { secretKeyRef: { name: ns-web-defectdojo, key: DD_HOST } } }
                - { name: DD_TOKEN, valueFrom: { secretKeyRef: { name: ns-web-defectdojo, key: DD_TOKEN } } }
                - { name: TG_TOKEN, valueFrom: { secretKeyRef: { name: sec-report-telegram, key: token,   optional: true } } }
                - { name: TG_CHAT,  valueFrom: { secretKeyRef: { name: sec-report-telegram, key: chat_id, optional: true } } }
              command: ["/bin/sh","-c"]
              args:
                - |
                  set -e
                  B="$DD_URL/api/v2"
                  q() { curl -sk -m 30 -H "Host: $DD_HOST" -H "Authorization: Token $DD_TOKEN" "$B/$1" | grep -o '"count":[0-9]*' | head -1 | cut -d: -f2; }
                  cnt() { q "findings/?active=true&duplicate=false&severity=$1&limit=1"; }
                  CRIT=$(cnt Critical); HIGH=$(cnt High); MED=$(cnt Medium); LOW=$(cnt Low)
                  MIT=$(q "findings/?is_mitigated=true&limit=1")
                  TI=$(q "test_imports/?limit=1")
                  NOW=$(date -u +%Y-%m-%dT%H:%MZ)
                  REPORT="SEC-002 Fix History (auto $NOW)

                  Active (non-duplicate): Critical=$CRIT  High=$HIGH  Medium=$MED  Low=$LOW
                  Resolved to date (mitigated): $MIT
                  Scan imports recorded (all-time): $TI

                  Source: DefectDojo AC-Portal. Detail: /api/v2/findings/?is_mitigated=true
                  Full report: Notion 'SEC-002 Fix History Report'."
                  echo "$REPORT"
                  echo "$REPORT" > /tmp/report.md
                  oc create configmap sec-fix-history \
                    --from-file=report.md=/tmp/report.md \
                    --from-literal=updated="$NOW" \
                    --dry-run=client -o yaml | oc apply -f -
                  echo "== configmap sec-fix-history updated =="
                  # --- Telegram delivery: best-effort, never fails the report ---
                  set +e
                  TG_TOKEN=$(printf '%s' "$TG_TOKEN" | tr -d '[:space:]')
                  if printf '%s' "$TG_TOKEN" | grep -qE '^[0-9]+:[A-Za-z0-9_-]{30,}$'; then
                    code=$(curl -sk -m 30 -o /tmp/tg.out -w "%{http_code}" -X POST \
                      "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
                      --data-urlencode "chat_id=$TG_CHAT" \
                      --data-urlencode "text=$(cat /tmp/report.md)")
                    echo "Telegram sendMessage HTTP $code"; head -c 200 /tmp/tg.out; echo
                  else
                    echo "Telegram token missing/invalid format — delivery skipped (report saved to ConfigMap)."
                  fi
                  exit 0
