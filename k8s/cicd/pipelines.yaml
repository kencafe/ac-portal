                done
              done
            fi
      workspaces: [{ name: manifest-dir, workspace: shared }]
    - name: dast
      runAfter: [deploy]
      taskRef: { kind: Task, name: zap-dast }
      params:
        - { name: TARGET_URL, value: "https://$(params.deploy-host)" }
        - { name: ENGAGEMENT, value: "dast-$(params.env)" }
      workspaces: [{ name: source, workspace: shared }]
---
