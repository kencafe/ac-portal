# Branch -> env-specific Pipeline routing. One EventListener with three triggers;
# each trigger has its own TriggerTemplate that starts the matching pinned
# Pipeline (ac-portal-cicd-{dev,staging,prod}). The env/namespace/host/run-dast
# come from the Pipeline's own parameter defaults, so the template only forwards
# git-url and git-revision from the webhook.
#
#   refs/heads/dev     -> ac-portal-cicd-dev
#   refs/heads/staging -> ac-portal-cicd-staging  (DAST)
#   refs/heads/main    -> ac-portal-cicd-prod
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata: { name: ns-web-tt-dev, namespace: ac-portal-cicd }
spec:
  params:
    - { name: git-revision }
    - { name: git-url }
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ns-web-dev-
        namespace: ac-portal-cicd
      spec:
        pipelineRef: { name: ac-portal-cicd-dev }
        taskRunTemplate: { serviceAccountName: ns-web-pipeline }
        params:
          - { name: git-url, value: $(tt.params.git-url) }
          - { name: git-revision, value: $(tt.params.git-revision) }
        workspaces:
          - name: shared
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteMany"]
                resources: { requests: { storage: 2Gi } }
                storageClassName: ac-bronze-share
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata: { name: ns-web-tt-staging, namespace: ac-portal-cicd }
spec:
  params:
    - { name: git-revision }
    - { name: git-url }
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ns-web-staging-
        namespace: ac-portal-cicd
      spec:
        pipelineRef: { name: ac-portal-cicd-staging }
        taskRunTemplate: { serviceAccountName: ns-web-pipeline }
        params:
          - { name: git-url, value: $(tt.params.git-url) }
          - { name: git-revision, value: $(tt.params.git-revision) }
        workspaces:
          - name: shared
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteMany"]
                resources: { requests: { storage: 2Gi } }
                storageClassName: ac-bronze-share
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata: { name: ns-web-tt-prod, namespace: ac-portal-cicd }
spec:
  params:
    - { name: git-revision }
    - { name: git-url }
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: ns-web-prod-
        namespace: ac-portal-cicd
      spec:
        pipelineRef: { name: ac-portal-cicd-prod }
        taskRunTemplate: { serviceAccountName: ns-web-pipeline }
        params:
          - { name: git-url, value: $(tt.params.git-url) }
          - { name: git-revision, value: $(tt.params.git-revision) }
        workspaces:
          - name: shared
            volumeClaimTemplate:
              spec:
                accessModes: ["ReadWriteMany"]
                resources: { requests: { storage: 2Gi } }
                storageClassName: ac-bronze-share
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata: { name: ns-web-bind-dev, namespace: ac-portal-cicd }
spec:
  params:
    - { name: git-url, value: $(body.repository.clone_url) }
    - { name: git-revision, value: dev }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata: { name: ns-web-bind-staging, namespace: ac-portal-cicd }
spec:
  params:
    - { name: git-url, value: $(body.repository.clone_url) }
    - { name: git-revision, value: staging }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata: { name: ns-web-bind-prod, namespace: ac-portal-cicd }
spec:
  params:
    - { name: git-url, value: $(body.repository.clone_url) }
    - { name: git-revision, value: main }
---
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: ns-web-el
  namespace: ac-portal-cicd
spec:
  serviceAccountName: ns-web-triggers
  triggers:
    - name: push-dev
      interceptors:
        - ref: { name: github }
          params:
            - { name: secretRef, value: { secretName: ns-web-webhook-secret, secretKey: secretToken } }
            - { name: eventTypes, value: ["push"] }
        - ref: { name: cel }
          params:
            - { name: filter, value: "body.ref == 'refs/heads/dev'" }
      bindings: [{ ref: ns-web-bind-dev }]
      template: { ref: ns-web-tt-dev }
    - name: push-staging
      interceptors:
        - ref: { name: github }
          params:
            - { name: secretRef, value: { secretName: ns-web-webhook-secret, secretKey: secretToken } }
            - { name: eventTypes, value: ["push"] }
        - ref: { name: cel }
          params:
            - { name: filter, value: "body.ref == 'refs/heads/staging'" }
      bindings: [{ ref: ns-web-bind-staging }]
      template: { ref: ns-web-tt-staging }
    - name: push-prod
      interceptors:
        - ref: { name: github }
          params:
            - { name: secretRef, value: { secretName: ns-web-webhook-secret, secretKey: secretToken } }
            - { name: eventTypes, value: ["push"] }
        - ref: { name: cel }
          params:
            - { name: filter, value: "body.ref == 'refs/heads/main'" }
      bindings: [{ ref: ns-web-bind-prod }]
      template: { ref: ns-web-tt-prod }
---
# EventListener ingress. No explicit host → OpenShift assigns the default apps
# wildcard host (served by the default ingress cert), so no custom TLS material
# is needed here. Public GitHub delivery requires exposing this externally
# (see the report note on webhook exposure).
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ns-web-el
  namespace: ac-portal-cicd
  labels: { app: ac-portal, component: ci }
spec:
  to: { kind: Service, name: el-ns-web-el, weight: 100 }
  port: { targetPort: http-listener }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
