# Neutral host for the CI-hub ArgoCD UI. Edge TLS with the golden wildcard cert
# (patched from Secret ns-web-tls in ac-portal-cicd, since inline cert material is
# never committed). argocd-server runs insecure HTTP behind edge termination.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: argocd-console
  namespace: ac-portal-cicd
  labels: { app: argocd, component: cicd-gitops }
spec:
  host: argocd.appcarrier.cloud
  to:
    kind: Service
    name: argocd-server
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
