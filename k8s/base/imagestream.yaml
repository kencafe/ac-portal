apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: ac-portal
  labels:
    app: ac-portal
    component: frontend
spec:
  lookupPolicy:
    local: true
  tags:
  - name: latest
    from:
      kind: DockerImage
      name: registry.redhat.io/ubi8/nodejs-18:latest
    importPolicy:
      scheduled: true
    referencePolicy:
      type: Local
  - name: dev
    from:
      kind: DockerImage 
      name: ac-portal:dev
    importPolicy:
      scheduled: false
    referencePolicy:
      type: Local
  - name: prod
    from:
      kind: DockerImage
      name: ac-portal:prod
    importPolicy:
      scheduled: false
    referencePolicy:
      type: Local