apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ac-portal
  labels:
    app: ac-portal
    component: frontend
spec:
  # host is set per-environment in the overlays
  to:
    kind: Service
    name: ac-portal
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
