# Daily AI auto-ingest. Calls the app's /api/v1/ai/run-feeds on the internal
# service (port 3000, bypassing the oauth2-proxy login gate) with the shared
# cron token. Schedule is 05:00 in the cluster timezone.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ac-portal-ai-ingest
  labels: { app: ac-portal, component: ai-cron }
spec:
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: { app: ac-portal, component: ai-cron }
        spec:
          restartPolicy: Never
          containers:
            - name: trigger
              image: image-registry.openshift-image-registry.svc:5000/ac-portal-dev/ubi9-nodejs-20:latest
              command: ["/bin/sh", "-c"]
              args:
                - >
                  curl -sS -X POST
                  -H "X-Cron-Token: $AI_CRON_TOKEN"
                  http://ac-portal.$(NAMESPACE).svc:3000/api/v1/ai/run-feeds
                  && echo "\nAI ingest triggered"
              env:
                - name: NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: AI_CRON_TOKEN
                  valueFrom: { secretKeyRef: { name: ns-web-ai, key: cron-token } }
              resources:
                requests: { memory: "64Mi", cpu: "50m" }
                limits: { memory: "128Mi", cpu: "200m" }
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: ["ALL"] }
                runAsNonRoot: true
                seccompProfile: { type: RuntimeDefault }
