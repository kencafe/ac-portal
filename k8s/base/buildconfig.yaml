apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: ac-portal
  labels:
    app: ac-portal
    component: frontend
spec:
  source:
    type: Git
    git:
      uri: file:///root/ac-projects/ac-portal-remote.git
      ref: main
    contextDir: "."
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
      from:
        kind: DockerImage
        name: registry.redhat.io/ubi8/nodejs-18:latest
      pullSecret:
        name: redhat-registry-secret
  output:
    to:
      kind: ImageStreamTag
      name: ac-portal:latest
  triggers:
  - type: GitHub
    github:
      secret: ac-portal-webhook-secret
  - type: Generic
    generic:
      secret: ac-portal-webhook-secret
  - type: ConfigChange
  - type: ImageChange
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"