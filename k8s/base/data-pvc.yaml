apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ns-web-data
  labels:
    app: ac-portal
    component: content-store
spec:
  # RWX (CephFS) so all replicas share the CMS content store (posts.json).
  accessModes: ["ReadWriteMany"]
  storageClassName: ac-bronze-share
  resources:
    requests:
      storage: 1Gi
