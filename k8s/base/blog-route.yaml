apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ac-portal-blog
  labels: { app: ac-portal, component: blog }
spec:
  # host is set per-environment in the overlays (blog[-env].appcarrier.cloud).
  # Middleware rewrites this host's root to /blog.
  to:
    kind: Service
    name: ac-portal
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
