apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac-portal
  labels:
    app: ac-portal
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ac-portal
      component: frontend
  template:
    metadata:
      labels:
        app: ac-portal
        component: frontend
      annotations:
        # Resolve the `ac-portal:latest` ImageStream tag to the internal
        # registry digest (lookupPolicy.local) for Deployment pods.
        alpha.image.policy.openshift.io/resolve-names: "*"
    spec:
      serviceAccountName: ns-web-cms
      # In-cluster CoreDNS only knows the apex appcarrier.cloud, not subdomains
      # (split-horizon DNS). Map the Keycloak SSO host to the router IP so the
      # oauth2-proxy sidecar can perform OIDC discovery over the public edge
      # route (golden cert covers *.appcarrier.cloud).
      hostAliases:
        - ip: "103.9.0.232"
          hostnames: ["sso.appcarrier.cloud"]
      containers:
        - name: ac-portal
          image: ac-portal:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ac-portal-config
            # Secrets sourced from HashiCorp Vault (AI keys, DB creds, API keys).
            # Optional so the frontend runs before the backend is wired.
            - secretRef:
                name: ns-web-secrets
                optional: true
          env:
            - name: DATA_DIR
              value: /app/.data
            # Local time for the daily-schedule hour gate (settings.aiScheduleHour).
            - name: TZ
              value: Asia/Ho_Chi_Minh
            # Shared token so the AI CronJob can call /api/v1/ai/run-feeds.
            - name: AI_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ns-web-ai
                  key: cron-token
                  optional: true
          volumeMounts:
            - name: content-store
              mountPath: /app/.data
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # Keycloak OIDC sidecar — protects the CMS route (login + role gate).
        # Validates the token against realm `ac-portal` and injects the signed-in
        # user + roles (groups claim) as X-Forwarded-* headers for the app's RBAC.
        - name: oauth2-proxy
          image: image-registry.openshift-image-registry.svc:5000/ac-portal-dev/oauth2-proxy:v7
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          args:
            - --http-address=0.0.0.0:8080
            - --upstream=http://127.0.0.1:3000
            - --provider=oidc
            - --oidc-issuer-url=https://sso.appcarrier.cloud/realms/ac-portal
            # Realm ac-portal ships a single custom scope that carries email,
            # preferred_username and the groups (realm-roles) claim.
            - --scope=openid ac-portal-groups
            - --oidc-groups-claim=groups
            # Only users holding a blog-* realm role may enter the CMS.
            - --allowed-group=blog-author
            - --allowed-group=blog-translator
            - --allowed-group=blog-editor
            - --allowed-group=blog-publisher
            - --allowed-group=blog-admin
            - --email-domain=*
            - --skip-provider-button=true
            # Allow the post-logout redirect (rd=) to the Keycloak RP-logout URL.
            - --whitelist-domain=sso.appcarrier.cloud
            - --pass-access-token=true
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --cookie-secure=true
            - --reverse-proxy=true
          env:
            - name: OAUTH2_PROXY_CLIENT_ID
              valueFrom: { secretKeyRef: { name: kc-cms-oidc, key: client-id } }
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: kc-cms-oidc, key: client-secret } }
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: { secretKeyRef: { name: ns-web-oauth2, key: cookie-secret } }
            # Per-env callback URL (overridden in overlays/*/configmap-patch).
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://cms-dev.appcarrier.cloud/oauth2/callback
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "200m" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: content-store
          persistentVolumeClaim:
            claimName: ns-web-data
