apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac-portal
  labels:
    app: ac-portal
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ac-portal
      component: frontend
  template:
    metadata:
      labels:
        app: ac-portal
        component: frontend
    spec:
      containers:
        - name: ac-portal
          image: ac-portal:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ac-portal-config
            # Secrets sourced from HashiCorp Vault (AI keys, DB creds, API keys).
            # Optional so the frontend runs before the backend is wired.
            - secretRef:
                name: ns-web-secrets
                optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
