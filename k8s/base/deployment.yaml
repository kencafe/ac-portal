apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac-portal
  labels:
    app: ac-portal
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ac-portal
      component: frontend
  template:
    metadata:
      labels:
        app: ac-portal
        component: frontend
      annotations:
        # Resolve the `ac-portal:latest` ImageStream tag to the internal
        # registry digest (lookupPolicy.local) for Deployment pods.
        alpha.image.policy.openshift.io/resolve-names: "*"
    spec:
      serviceAccountName: ns-web-cms
      containers:
        - name: ac-portal
          image: ac-portal:latest
          ports:
            - containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ac-portal-config
            # Secrets sourced from HashiCorp Vault (AI keys, DB creds, API keys).
            # Optional so the frontend runs before the backend is wired.
            - secretRef:
                name: ns-web-secrets
                optional: true
          env:
            - name: DATA_DIR
              value: /app/.data
          volumeMounts:
            - name: content-store
              mountPath: /app/.data
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
        # OpenShift OAuth sidecar — protects the CMS route (login + SAR gate).
        - name: oauth-proxy
          image: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          args:
            - --http-address=:8080
            - --https-address=
            - --provider=openshift
            - --skip-provider-button=true
            - --openshift-service-account=ns-web-cms
            - --upstream=http://localhost:3000
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --cookie-secure=true
            - '--openshift-sar={"namespace":"ac-portal-dev","resource":"deployments","group":"apps","verb":"update"}'
            - --email-domain=*
            - --pass-user-headers=true
          volumeMounts:
            - name: oauth-cookie
              mountPath: /etc/proxy/secrets
          resources:
            requests: { memory: "64Mi", cpu: "50m" }
            limits: { memory: "128Mi", cpu: "200m" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: content-store
          persistentVolumeClaim:
            claimName: ns-web-data
        - name: oauth-cookie
          secret:
            secretName: ns-web-oauth
