apiVersion: v1
kind: ConfigMap
metadata: { name: loki-config, namespace: observability }
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: warn
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 336h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
    compactor:
      working_directory: /loki/compactor
      delete_request_store: filesystem
      retention_enabled: true
    analytics:
      reporting_enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: loki-data, namespace: observability }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 10Gi } }
  storageClassName: ac-bronze-single
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki, namespace: observability, labels: { app: loki } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      containers:
        - name: loki
          image: registry.apps.xplat.fis.com.vn/grafana/loki:3.1.1
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports: [ { containerPort: 3100, name: http }, { containerPort: 9095, name: grpc } ]
          readinessProbe: { httpGet: { path: /ready, port: 3100 }, initialDelaySeconds: 20, periodSeconds: 10 }
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
          resources: { requests: { cpu: 150m, memory: 256Mi }, limits: { cpu: 500m, memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, runAsNonRoot: true, capabilities: { drop: ["ALL"] }, seccompProfile: { type: RuntimeDefault } }
      volumes:
        - { name: config, configMap: { name: loki-config } }
        - { name: data, persistentVolumeClaim: { claimName: loki-data } }
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: observability, labels: { app: loki } }
spec:
  selector: { app: loki }
  ports: [ { name: http, port: 3100, targetPort: 3100 } ]
