# Kargo PoC UI route. Edge TLS with the golden wildcard cert (patched from the
# cert files / ns-web-tls; inline cert material is never committed). The Kargo API
# server runs plain HTTP (api.tls.enabled=false) behind edge termination.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kargo
  namespace: kargo
  labels: { app.kubernetes.io/part-of: kargo-poc }
spec:
  host: kargo.appcarrier.cloud
  to:
    kind: Service
    name: kargo-api
    weight: 100
  port:
    targetPort: 80
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
