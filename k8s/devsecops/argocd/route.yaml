# Edge-TLS route for the namespaced ArgoCD server (golden cert applied live).
# argocd-server runs with insecure=true (plain HTTP) so edge termination is correct.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  # NOTE: name deliberately differs from the operator-managed `argocd-server` so the
  # GitOps operator does not prune this custom golden-cert route on reconcile.
  name: argocd-console
  namespace: ac-portal-dev
  labels: { app: argocd, component: devsecops }
spec:
  host: argocd-dev.appcarrier.cloud
  to: { kind: Service, name: argocd-server, weight: 100 }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
