apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac-portal
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: ac-portal
        env:
        - name: NODE_ENV
          value: "development"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"