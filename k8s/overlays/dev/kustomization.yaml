apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ac-portal-dev
resources:
  - ../../base
patches:
  - path: route-patch.yaml
  - path: deployment-patch.yaml
  - path: configmap-patch.yaml
labels:
  - pairs:
      environment: dev
    includeSelectors: false
images:
  - name: ac-portal
    newTag: dev
