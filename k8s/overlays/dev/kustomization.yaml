apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: ac-portal-dev

namespace: ac-portal-dev

resources:
- ../../base

patchesStrategicMerge:
- deployment-patch.yaml
- route-patch.yaml
- configmap-patch.yaml

commonLabels:
  environment: development
  
images:
- name: ac-portal
  newTag: dev