apiVersion: apps/v1
kind: Deployment
metadata:
  name: ac-portal
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: ac-portal
          env:
            - name: MINIO_PUBLIC_BASE
              value: https://minio-staging.appcarrier.cloud
        # Independent CMS auth per env: staging uses its own Keycloak client
        # (ac-portal-cms-staging, via the kc-cms-oidc secret) and its OWN callback
        # host. The base default points at cms-dev — override it here.
        - name: oauth2-proxy
          env:
            - name: OAUTH2_PROXY_REDIRECT_URL
              value: https://cms-staging.appcarrier.cloud/oauth2/callback
