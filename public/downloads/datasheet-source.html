<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>FPT-IS NS — Service Datasheet</title>
<style>
  :root{ --orange:#F37021; --blue:#0072BC; --cyan:#38A3D8; --green:#57A336; --navy:#001529; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  body{font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif; color:rgba(0,0,0,.88)}
  @page{ size:A4; margin:0 }
  .page{ position:relative; width:210mm; height:297mm; overflow:hidden; background:#fff;
    display:flex; flex-direction:column; page-break-after:always }
  .page:last-child{page-break-after:auto}
  .rule{height:4px; flex-shrink:0; background:linear-gradient(90deg,var(--orange) 0 33.34%,var(--blue) 33.34% 66.67%,var(--green) 66.67% 100%)}
  /* head band (page 1) */
  .head{background:var(--navy); color:#fff; padding:9mm 18mm; border-bottom:4px solid var(--tone)}
  .head-top{display:flex; align-items:center; justify-content:space-between}
  .lock{display:flex; align-items:center; gap:9px}
  .lock .m{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--orange),var(--blue))}
  .lock b{font-size:14px;font-weight:700;letter-spacing:.3px}
  .lock span{display:block;font-size:8px;letter-spacing:2.5px;font-weight:600;color:rgba(255,255,255,.55)}
  .dslabel{font-size:11px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.5)}
  .head-mid{display:flex; align-items:center; gap:12px; margin-top:16px}
  .plate{min-width:58px;height:34px;padding:0 10px;border-radius:4px;background:var(--tone);color:#fff;
    font-size:15px;font-weight:800;letter-spacing:.1em;display:flex;align-items:center;justify-content:center}
  .grouptag{height:26px;padding:0 12px;border-radius:13px;background:rgba(255,255,255,.1);
    font-size:12px;display:flex;align-items:center;color:rgba(255,255,255,.85)}
  h1{font-size:31px;font-weight:700;letter-spacing:-.025em;line-height:1.16;margin-top:14px}
  .h1en{font-size:17px;color:rgba(255,255,255,.6);font-weight:500;margin-top:2px}
  /* body */
  .body{flex:1; padding:9mm 18mm 0}
  .pitch{font-size:15px;line-height:1.68;color:rgba(0,0,0,.8)}
  .sh{display:flex;align-items:baseline;gap:10px;margin:16px 0 8px}
  .sh .sq{width:10px;height:10px;border-radius:2px;background:var(--tone);position:relative;top:1px}
  .sh h2{font-size:18px;font-weight:600;letter-spacing:-.015em}
  .sh .en{font-size:12.5px;color:rgba(0,0,0,.45)}
  /* spec table */
  .spec{border:1px solid rgba(5,5,5,.08);border-radius:8px;overflow:hidden}
  .spec .row{display:grid;grid-template-columns:42mm 1fr;gap:14px;padding:7px 14px;align-items:baseline;border-bottom:1px solid rgba(5,5,5,.07)}
  .spec .row:last-child{border-bottom:none}
  .spec .row:nth-child(even){background:#FAFAFA}
  .spec .k{font-size:13px;font-weight:500;color:rgba(0,0,0,.6)}
  .spec .k .en{display:block;font-size:11px;color:rgba(0,0,0,.4)}
  .spec .v{font-size:14.5px;color:rgba(0,0,0,.82)}
  /* two-col deliverables/outcomes */
  .two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:14px}
  .col h3{font-size:11.5px;font-weight:700;letter-spacing:.1em;color:rgba(0,0,0,.5);margin-bottom:6px}
  .col .li{display:flex;gap:8px;font-size:13.5px;line-height:1.55;padding:4px 0;border-bottom:1px solid rgba(5,5,5,.06)}
  .col .li:last-child{border-bottom:none}
  .col .li .mk{flex:0 0 auto;font-weight:700}
  .deliver .mk{color:var(--green)}
  .outcome .mk{color:var(--tone)}
  /* footer */
  .foot{margin:0 18mm;padding:8px 0 10mm;display:flex;justify-content:space-between;
    font-size:11.5px;color:rgba(0,0,0,.4);border-top:1px solid rgba(5,5,5,.08)}
  /* page 2 */
  .body2{flex:1;padding:14mm 18mm 0}
  .phases{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .ph{border:1px solid rgba(5,5,5,.08);border-top-width:3px;border-radius:8px;padding:12px 14px}
  .ph .eb{font-size:11px;font-weight:800;color:rgba(0,0,0,.35)}
  .ph .pt{font-size:16px;font-weight:600;margin:2px 0 8px}
  .ph .b{display:flex;gap:7px;font-size:13px;line-height:1.5;padding:2px 0}
  .ph .b .dot{flex:0 0 auto;width:5px;height:5px;border-radius:50%;margin-top:6px}
  .stack{margin-top:14px;border:1px solid rgba(5,5,5,.08);border-radius:8px;padding:14px}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .chip{height:26px;padding:0 10px;border-radius:4px;background:#FAFAFA;border:1px solid rgba(5,5,5,.1);
    font-size:12.5px;color:rgba(0,0,0,.7);display:inline-flex;align-items:center}
  .cta{margin-top:14px;background:linear-gradient(140deg,#0B3C86,#071A46);color:#fff;border-radius:8px;
    padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
  .cta .t{font-size:16px;font-weight:600;line-height:1.4}
  .cta .t .en{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-top:3px;font-weight:400}
  .cta .contacts{display:flex;flex-direction:column;gap:6px;min-width:62mm}
  .cta .cc{background:rgba(255,255,255,.08);border-radius:6px;padding:7px 11px;display:flex;
    justify-content:space-between;gap:12px;font-size:12px}
  .cta .cc .l{color:rgba(255,255,255,.55)}
</style>
</head>
