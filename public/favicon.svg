<svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="carrierGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
  </defs>
  
  <g fill="url(#carrierGradient)">
    <!-- Carrier Hull - Main Body -->
    <path d="M15 45 L95 45 L105 40 L105 55 L95 50 L15 50 Z" />
    
    <!-- Flight Deck -->
    <rect x="20" y="35" width="75" height="12" rx="2" />
    
    <!-- Aircraft Carrier Island/Tower -->
    <rect x="70" y="20" width="12" height="20" rx="2" />
    <rect x="75" y="15" width="4" height="8" rx="1" />
    
    <!-- Radar/Antenna -->
    <line x1="77" y1="15" x2="77" y2="10" stroke-width="1" stroke="url(#carrierGradient)" />
    <circle cx="77" cy="12" r="1.5" />
    
    <!-- Aircraft on Deck -->
    <!-- Aircraft 1 -->
    <g>
      <path d="M30 38 L42 38 L40 36 L38 36 L36 34 L34 36 L32 36 Z" />
      <line x1="36" y1="34" x2="36" y2="32" stroke-width="0.5" stroke="#ef4444" />
      <line x1="34" y1="32" x2="38" y2="32" stroke-width="0.5" stroke="#ef4444" />
    </g>
    
    <!-- Aircraft 2 -->
    <g>
      <path d="M50 40 L62 40 L60 38 L58 38 L56 36 L54 38 L52 38 Z" />
      <line x1="56" y1="36" x2="56" y2="34" stroke-width="0.5" stroke="#ef4444" />
      <line x1="54" y1="34" x2="58" y2="34" stroke-width="0.5" stroke="#ef4444" />
    </g>
    
    <!-- Deck Lines -->
    <line x1="25" y1="39" x2="65" y2="39" stroke-width="0.3" stroke="url(#carrierGradient)" opacity="0.6" stroke-dasharray="2,1" />
    <line x1="25" y1="43" x2="65" y2="43" stroke-width="0.3" stroke="url(#carrierGradient)" opacity="0.6" stroke-dasharray="2,1" />
    
    <!-- Deck Markings -->
    <circle cx="85" cy="41" r="3" fill="none" stroke="url(#carrierGradient)" stroke-width="0.5" opacity="0.7" />
    <circle cx="45" cy="41" r="3" fill="none" stroke="url(#carrierGradient)" stroke-width="0.5" opacity="0.7" />
  </g>
</svg>