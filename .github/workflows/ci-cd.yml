name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
  OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}

jobs:
  # Code Quality & Testing
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      # - name: Run tests
      #   run: npm test

  # Build on OpenShift
  build:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      build-number: ${{ steps.build.outputs.build-number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Login to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Trigger OpenShift Build
        id: build
        run: |
          # Determine target namespace based on branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            NAMESPACE="ac-portal-prod"
            TAG="prod"
          else
            NAMESPACE="ac-portal-dev" 
            TAG="dev"
          fi
          
          oc project $NAMESPACE
          
          # Start new build
          BUILD_NAME=$(oc start-build ac-portal --from-repo=. --wait --follow)
          BUILD_NUMBER=$(echo $BUILD_NAME | grep -o '[0-9]*$')
          
          # Tag the built image
          oc tag ac-portal:latest ac-portal:$TAG
          oc tag ac-portal:latest ac-portal:build-$BUILD_NUMBER
          
          echo "build-number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Built image: ac-portal:$TAG (build #$BUILD_NUMBER)"

  # Deploy to Development Environment
  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Login to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Deploy to development namespace
        run: |
          oc project ac-portal-dev
          
          # Update image tag in kustomization
          cd k8s/overlays/dev
          kustomize edit set image ac-portal=ac-portal:dev
          
          # Apply manifests
          oc apply -k .
          
          # Wait for rollout
          oc rollout status deployment/ac-portal --timeout=300s

      - name: Verify deployment
        run: |
          oc get pods -l app=ac-portal -n ac-portal-dev
          oc get routes -n ac-portal-dev

  # Deploy to Production Environment
  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Login to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Deploy to production namespace
        run: |
          oc project ac-portal-prod
          
          # Update image tag in kustomization  
          cd k8s/overlays/prod
          kustomize edit set image ac-portal=ac-portal:prod
          
          # Apply manifests
          oc apply -k .
          
          # Wait for rollout
          oc rollout status deployment/ac-portal --timeout=600s

      - name: Verify deployment
        run: |
          oc get pods -l app=ac-portal -n ac-portal-prod
          oc get routes -n ac-portal-prod

  # Security Scan
  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Install OpenShift CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Login to OpenShift
        run: |
          oc login --token=${{ secrets.OPENSHIFT_TOKEN }} --server=${{ secrets.OPENSHIFT_SERVER }}

      - name: Run OpenShift Image Security Scan
        run: |
          # Determine namespace based on branch
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            NAMESPACE="ac-portal-prod"
            TAG="prod"
          else
            NAMESPACE="ac-portal-dev"
            TAG="dev"
          fi
          
          oc project $NAMESPACE
          
          # Get image SHA from ImageStream
          IMAGE_SHA=$(oc get istag ac-portal:$TAG -o jsonpath='{.image.metadata.name}')
          echo "Scanning image: $IMAGE_SHA"
          
          # Check for any security vulnerabilities in the image
          oc describe image $IMAGE_SHA | grep -i "vulnerabilit\|security\|cve" || echo "No security issues found in image metadata"